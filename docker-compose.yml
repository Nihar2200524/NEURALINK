services:
  bridge:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BRIDGE_TIMEOUT: ${BRIDGE_TIMEOUT:-15}
      BRIDGE_MAX_RESPONSE_BYTES: ${BRIDGE_MAX_RESPONSE_BYTES:-2000000}
      BRIDGE_CACHE_TTL: ${BRIDGE_CACHE_TTL:-300}
      BRIDGE_CONCURRENCY: ${BRIDGE_CONCURRENCY:-8}
      BRIDGE_RESPECT_ROBOTS: ${BRIDGE_RESPECT_ROBOTS:-true}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 2
    restart: unless-stopped
