name: mhp
services:
  agentra:
    build: .
    image: agentra:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENTRA_TOKENS: ${AGENTRA_TOKENS:?Set tenant tokens}
      AGENTRA_APPROVER_TOKEN: ${AGENTRA_APPROVER_TOKEN:?Set a separate approver secret}
      AGENTRA_HEADED: "false"
      AGENTRA_MAX_SESSIONS: "4"
      AGENTRA_SESSION_MEMORY_MB: "768"
    mem_limit: 4g
    pids_limit: 512
    shm_size: 1g
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
      - /home/agentra/.cache:rw,nosuid,nodev,size=128m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
